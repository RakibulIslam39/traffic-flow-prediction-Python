name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC: notices new library releases that break us

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No leftover merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ; then
            echo "::error::merge-conflict markers found (see the lines above)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Ruff: real bugs only (syntax errors, undefined names, unused imports)"
        run: |
          python -m pip install ruff==0.17.6
          ruff check --select E9,F --no-cache .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Unit and regression tests
        run: pytest -q

      - name: End-to-end smoke test
        run: scripts/smoke_test.sh
        env:
          PYTHON: python
